<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AMG Menús</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --ember:#ff4d00;
  --black:#121212;
  --chalk:#e2e8f0;
  --bone:#efefef;
  --soot:#3a3a3a;
  --ash:#747474;
  --font:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:2.8px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--black)}
body{
  font-family:var(--font);
  font-size:14px;line-height:1.4;
  color:var(--bone);background:var(--black);
  min-height:100dvh;
  letter-spacing:-0.01em;
}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--ember);color:var(--black)}
:focus-visible{outline:1px solid var(--ember);outline-offset:2px}

/* ══ HEADER ══ */
.header{
  position:sticky;top:0;z-index:50;
  background:rgba(18,18,18,.94);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--chalk);
}
.header__inner{
  max-width:1000px;margin:0 auto;
  padding:14px 20px;
  display:flex;align-items:center;gap:20px;
}
.logo{
  font-family:var(--font);font-weight:700;
  font-size:15px;letter-spacing:.02em;
  color:var(--ember);text-transform:uppercase;
  white-space:nowrap;
  flex-shrink:0;
}
.logo small{
  display:block;font-size:9px;font-weight:400;
  letter-spacing:.14em;color:var(--ash);
  margin-top:2px;
}

.search{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  transition:border-color .2s var(--ease);
}
.search:focus-within{border-color:var(--ember)}
.search i.fa-magnifying-glass{color:var(--ash);font-size:12px;flex-shrink:0}
.search:focus-within i.fa-magnifying-glass{color:var(--ember)}
.search input{
  flex:1;min-width:0;
  padding:11px 0;
  background:transparent;border:none;outline:none;
  color:var(--bone);
  font-family:var(--font);
  font-size:13px;
  letter-spacing:0;
}
.search input::placeholder{color:var(--ash)}
.search__clear{
  color:var(--ash);font-size:12px;padding:4px;
  transition:color .2s var(--ease);
  display:none;
}
.search__clear.visible{display:block}
.search__clear:hover{color:var(--ember)}

@media(max-width:640px){
  .header__inner{
    flex-wrap:wrap;
    padding:12px 16px;
    gap:12px;
  }
  .search{order:2;flex-basis:100%}
}

/* ══ MAIN ══ */
.main{
  max-width:1000px;margin:0 auto;
  padding:20px 20px 80px;
}
@media(max-width:640px){.main{padding:16px 16px 60px}}

/* ══ HINTS ══ */
.hints{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:16px;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  align-items:center;
  color:var(--ash);
}
.hints__label{color:var(--ash);margin-right:4px}
.hints button{
  padding:5px 10px;
  border:1px solid var(--soot);
  border-radius:var(--r);
  color:var(--ash);
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  transition:border-color .2s var(--ease),color .2s var(--ease);
}
.hints button:hover{border-color:var(--ember);color:var(--ember)}

/* ══ META ══ */
.meta{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:4px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ash);
  border-bottom:1px solid var(--chalk);
}
.meta b{color:var(--bone);font-weight:400}

/* ══ LIST ══ */
.list{display:flex;flex-direction:column}

.row{
  display:grid;
  grid-template-columns:52px 1fr auto;
  gap:16px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--chalk);
  transition:background .15s var(--ease);
}
.row:hover{background:rgba(255,77,0,.03)}

.row__img{
  width:52px;height:52px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  overflow:hidden;
  display:grid;place-items:center;
  background:var(--black);
  flex-shrink:0;
}
.row__img img{width:100%;height:100%;object-fit:cover}
.row__img i{color:var(--ash);font-size:18px}

.row__body{min-width:0}

.row__title{
  display:flex;flex-wrap:wrap;align-items:baseline;
  gap:6px 10px;
  margin-bottom:3px;
}
.row__name{
  font-family:var(--font);font-weight:700;
  font-size:16px;line-height:1.2;
  letter-spacing:-0.01em;
  color:var(--bone);text-transform:uppercase;
  word-break:break-word;
}
.row__name mark,
.row__branch mark{
  background:var(--ember);color:var(--black);
  padding:0 3px;
}
.row__branch{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--bone);
}
.row__branch i{font-size:8px;color:var(--ember)}

.row__sub{
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ash);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row__sub i{font-size:9px;margin-right:4px}

.row__actions{
  display:flex;gap:6px;flex-wrap:wrap;
  justify-content:flex-end;
}

.act{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  font-family:var(--font);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--bone);background:transparent;
  transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease);
  line-height:1;
  white-space:nowrap;
}
.act i{font-size:10px}
.act:hover{border-color:var(--ember);color:var(--ember)}
.act--accent{border-color:var(--ember);color:var(--ember)}
.act--accent:hover{background:rgba(255,77,0,.08)}

@media(max-width:640px){
  .row{grid-template-columns:44px 1fr;gap:12px;padding:12px 0}
  .row__img{width:44px;height:44px}
  .row__actions{grid-column:1 / -1;justify-content:flex-start;margin-top:4px}
  .row__name{font-size:14px}
}

/* ══ EMPTY ══ */
.empty{
  padding:56px 0;
  text-align:center;
  color:var(--ash);
  font-size:12px;letter-spacing:.04em;text-transform:uppercase;
}
.empty i{
  display:block;font-size:24px;
  margin-bottom:12px;color:var(--soot);
}

/* ══ FOOTER ══ */
.footer{
  max-width:1000px;margin:0 auto;
  padding:20px;
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ash);
  border-top:1px solid var(--chalk);
}

/* ══ ADMIN (oculto) ══ */
#admin-trigger{
  position:fixed;bottom:0;left:0;
  width:28px;height:28px;
  background:transparent;cursor:default;z-index:40;
}

.admin{
  display:none;
  padding:14px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  margin-bottom:16px;
}
.admin.visible{display:block}
.admin__head{
  display:flex;justify-content:space-between;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--soot);
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ash);
}
.admin__form{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;
}
@media(max-width:640px){.admin__form{grid-template-columns:1fr}}
.admin input{
  padding:9px 11px;
  background:transparent;border:1px solid var(--chalk);
  border-radius:var(--r);
  color:var(--bone);font-family:var(--font);font-size:12px;
  outline:none;transition:border-color .15s var(--ease);
}
.admin input::placeholder{color:var(--ash)}
.admin input:focus{border-color:var(--ember)}
.admin__actions{display:flex;gap:6px}

/* ══ MODAL ══ */
.modal{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  background:rgba(18,18,18,.94);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;
  transition:opacity .2s var(--ease),visibility .2s var(--ease);
}
.modal.active{opacity:1;visibility:visible}
.modal__panel{
  width:min(560px,100%);
  max-height:84vh;
  display:flex;flex-direction:column;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  background:var(--black);
  overflow:hidden;
  transform:translateY(6px);
  transition:transform .2s var(--ease);
}
.modal.active .modal__panel{transform:translateY(0)}
.modal__head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--chalk);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
}
.modal__head b{font-weight:700;color:var(--bone)}
.modal__close{
  width:24px;height:24px;
  display:grid;place-items:center;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  color:var(--bone);font-size:10px;
  transition:border-color .15s var(--ease),color .15s var(--ease);
}
.modal__close:hover{border-color:var(--ember);color:var(--ember)}
.modal__body{padding:14px 16px;overflow-y:auto}
.modal__body::-webkit-scrollbar{width:6px}
.modal__body::-webkit-scrollbar-thumb{background:var(--soot)}

.cat{margin-bottom:16px}
.cat:last-child{margin-bottom:0}
.cat__head{
  display:flex;align-items:center;gap:8px;
  padding-bottom:8px;margin-bottom:8px;
  border-bottom:1px solid var(--soot);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--bone);
}
.cat__head i{color:var(--ember);font-size:11px}

.link{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:9px 11px;
  border:1px solid var(--chalk);
  border-radius:var(--r);
  margin-bottom:5px;
  font-size:12px;
  color:var(--bone);
  transition:border-color .15s var(--ease),color .15s var(--ease);
}
.link:last-child{margin-bottom:0}
.link:hover{border-color:var(--ember);color:var(--ember)}
.link__b{
  display:flex;align-items:center;gap:7px;
  text-transform:uppercase;letter-spacing:.04em;font-size:11px;
}
.link__b i{font-size:9px;color:var(--ash)}
.link:hover .link__b i{color:var(--ember)}
.link__go{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ash);
}
.link:hover .link__go{color:var(--ember)}

.no-data{
  padding:9px 11px;
  border:1px dashed var(--soot);
  border-radius:var(--r);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ash);
}
</style>
</head>

    },
    "Palermo": {
      rappi: [{branch:"anzures", url:"https://www.rappi.com.mx/restaurantes/1930290995-palermo-empanadas-argentinas"}],
      uber: [{branch:"anzures", url:"https://www.ubereats.com/mx/store/palermo-empanadas-argentinas/FphmISDWUyGHcuJWMxOftw?diningMode=DELIVERY"}]
    },
    "Tiin Thai": {
      rappi: [{branch:"anzures", url:"https://www.rappi.com.mx/restaurantes/1930234375-tiin-thai"}],
      uber: [{branch:"anzures", url:"https://www.ubereats.com/mx/store/tiin-thai/3FH5oqSnXWCu8tkySoyzAQ?diningMode=DELIVERY"}]
    }
  };

  const DEFAULT = [
    {name:"Chubbies Burger", category:"Burgers · Fast Casual", menuUrl:"http://pide.chubbiesburger.mx/", instaUrl:"https://www.instagram.com/chubbies_burger", thumb:"https://i.postimg.cc/zDt9P1cF/IMG-4348.webp", handle:"@chubbies_burger"},
    {name:"Muy Gallito", category:"Pollo · Street Food", menuUrl:"https://order.foodbot.ai/muygallito/", instaUrl:"https://www.instagram.com/muygallitomx", thumb:"https://i.postimg.cc/JndPKRzz/IMG-4351.webp", handle:"@muygallitomx"},
    {name:"Fat Bastard", category:"Comfort Food · Clásicos", menuUrl:"https://order.foodbot.ai/fatbastard/", instaUrl:"https://www.instagram.com/eatfatbastard", thumb:"https://i.postimg.cc/TwyHzKSp/IMG-4350.webp", handle:"@eatfatbastard"},
    {name:"Brass Monkey", category:"Pizza · Artesanal", menuUrl:"https://order.foodbot.ai/brassmonkey/", instaUrl:"https://www.instagram.com/brassmonkeypizza", thumb:"https://i.postimg.cc/J4QKd30C/IMG-4349.webp", handle:"@brassmonkeypizza"},
    {name:"Tiin Thai", category:"Thai · Fusión Asiática", menuUrl:"https://order.foodbot.ai/tiinthai/", instaUrl:"https://www.instagram.com/tiinthai", thumb:"https://i.postimg.cc/mDxQrhky/IMG-4352.webp", handle:"@tiinthai"},
    {name:"Palermo", category:"Empanadas · Argentino", menuUrl:"https://order.foodbot.ai/palermo/", instaUrl:"https://www.instagram.com/palermoempanadasmx", thumb:"https://i.postimg.cc/Z54DpzpQ/IMG-4339.jpg", handle:"@palermoempanadasmx"}
  ];

  let brands = JSON.parse(JSON.stringify(DEFAULT));

  /* ══════════════════════════════════════════════════════
     UTILS
     ══════════════════════════════════════════════════════ */
  const norm = s => (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function highlight(text, terms){
    const raw = esc(text);
    if (!terms.length) return raw;
    const pattern = terms
      .filter(t => t.length >= 2)
      .map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
      .join('|');
    if (!pattern) return raw;
    return raw.replace(new RegExp(`(${pattern})`,'gi'), '<mark>$1</mark>');
  }

  /* ══════════════════════════════════════════════════════
     CONSTRUIR ÍNDICE PLANO
     ══════════════════════════════════════════════════════ */
  function buildIndex(){
    const rows = [];
    brands.forEach(b => {
      const data = deliveryData[b.name] || {rappi:[], uber:[]};
      const locs = new Map();
      (data.uber||[]).forEach(u => {
        const k = norm(u.branch);
        if (!locs.has(k)) locs.set(k, {branch: u.branch, uber:null, rappi:null});
        locs.get(k).uber = u.url;
      });
      (data.rappi||[]).forEach(r => {
        const k = norm(r.branch);
        if (!locs.has(k)) locs.set(k, {branch: r.branch, uber:null, rappi:null});
        locs.get(k).rappi = r.url;
      });
      const locations = [...locs.values()];

      // Row "marca"
      rows.push({
        type: 'brand',
        brand: b,
        branch: '',
        uber: null,
        rappi: null,
        locations,
        haystack: norm([b.name, b.category, b.handle, 'menu','directo','instagram'].join(' '))
      });

      // Rows por sucursal
      locations.forEach(loc => {
        rows.push({
          type: 'branch',
          brand: b,
          branch: loc.branch,
          uber: loc.uber,
          rappi: loc.rappi,
          locations: [loc],
          haystack: norm([
            b.name, b.category, loc.branch,
            loc.uber ? 'uber uber eats' : '',
            loc.rappi ? 'rappi' : ''
          ].join(' '))
        });
      });
    });
    return rows;
  }

  let INDEX = buildIndex();
  let query = '';

  /* ══════════════════════════════════════════════════════
     RENDER
     ══════════════════════════════════════════════════════ */
  const listEl = document.getElementById('list');
  const metaCount = document.getElementById('meta-count');
  const metaLabel = document.getElementById('meta-label');
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');

  function render(){
    const terms = norm(query).split(/\s+/).filter(Boolean);

    // Filtrar
    let items;
    if (!terms.length){
      // Sin búsqueda → solo filas de marca
      items = INDEX.filter(r => r.type === 'brand');
    } else {
      // Con búsqueda → buscar en TODO el índice
      items = INDEX.filter(r => terms.every(t => r.haystack.includes(t)));

      // Priorizar: si una sucursal coincide con todos los terms, la mostramos
      // Si solo la marca coincide, mostramos la fila de marca
      const branchMatches = items.filter(r => r.type === 'branch');
      const brandMatches = items.filter(r => r.type === 'brand');

      // Si hay branch matches, mostrarlas; si no, mostrar brand matches
      items = branchMatches.length ? branchMatches : brandMatches;
    }

    // Meta
    if (!query){
      metaCount.textContent = String(brands.length).padStart(2,'0');
      metaLabel.textContent = 'Todas las marcas';
    } else {
      metaCount.textContent = String(items.length).padStart(2,'0');
      metaLabel.textContent = `Resultados para "${query}"`;
    }

    // Render
    listEl.innerHTML = '';

    if (!items.length){
      listEl.innerHTML = `
        <div class="empty">
          <i class="fas fa-circle-notch"></i>
          Sin resultados para "${esc(query)}"
        </div>`;
      return;
    }

    items.slice(0, 60).forEach(row => {
      const b = row.brand;
      const imgHTML = b.thumb
        ? `<img src="${b.thumb}" alt="${esc(b.name)}" loading="lazy">`
        : `<i class="fas fa-utensils"></i>`;

      const nameHTML = highlight(b.name, terms);

      const branchHTML = row.branch
        ? `<span class="row__branch"><i class="fas fa-location-dot"></i>${highlight(row.branch, terms)}</span>`
        : '';

      // Sub: categoría + sucursales
      let sub;
      if (row.type === 'brand'){
        const n = row.locations.length;
        sub = `${esc(b.category || 'Marca')} · ${n} sucursal${n===1?'':'es'}`;
      } else {
        sub = esc(b.category || '');
      }

      // Acciones
      let actions = '';
      if (row.type === 'brand'){
        actions = `
          <a class="act act--accent" href="${b.menuUrl}" target="_blank" rel="noopener">
            <i class="fas fa-utensils"></i>Menú
          </a>
          ${b.instaUrl ? `<a class="act" href="${b.instaUrl}" target="_blank" rel="noopener"><i class="fab fa-instagram"></i>IG</a>` : ''}
          <button class="act" data-open="${esc(b.name)}">
            <i class="fas fa-mobile-alt"></i>Delivery
          </button>
        `;
      } else {
        if (row.uber) actions += `<a class="act act--accent" href="${row.uber}" target="_blank" rel="noopener"><i class="fab fa-uber"></i>Uber</a>`;
        if (row.rappi) actions += `<a class="act${row.uber?'':' act--accent'}" href="${row.rappi}" target="_blank" rel="noopener"><i class="fas fa-motorcycle"></i>Rappi</a>`;
        actions += `<button class="act" data-open="${esc(b.name)}"><i class="fas fa-list"></i>Todas</button>`;
      }

      const el = document.createElement('article');
      el.className = 'row';
      el.innerHTML = `
        <div class="row__img">${imgHTML}</div>
        <div class="row__body">
          <div class="row__title">
            <span class="row__name">${nameHTML}</span>
            ${branchHTML}
          </div>
          <div class="row__sub"><i class="fas fa-tag"></i>${sub}</div>
        </div>
        <div class="row__actions">${actions}</div>
      `;
      listEl.appendChild(el);
    });

    document.querySelectorAll('[data-open]').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.getAttribute('data-open')));
    });
  }

  /* ══════════════════════════════════════════════════════
     BÚSQUEDA
     ══════════════════════════════════════════════════════ */
  let timer;
  searchInput.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      query = searchInput.value;
      searchClear.classList.toggle('visible', query.length > 0);
      render();
    }, 80);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    searchClear.classList.remove('visible');
    render();
    searchInput.focus();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput){
      e.preventDefault();
      searchInput.focus();
    }
  });

  // Hints
  document.querySelectorAll('[data-fill]').forEach(el => {
    el.addEventListener('click', () => {
      searchInput.value = el.getAttribute('data-fill');
      query = searchInput.value;
      searchClear.classList.add('visible');
      render();
      searchInput.focus();
    });
  });

  /* ══════════════════════════════════════════════════════
     MODAL
     ══════════════════════════════════════════════════════ */
  const modal = document.getElementById('deliveryModal');
  const modalTitle = document.getElementById('modalBrandTitle');
  const modalBody = document.getElementById('modalBodyContent');
  const closeModal = document.getElementById('closeModalBtn');

  function openModal(brandName){
    const data = deliveryData[brandName] || {rappi:[], uber:[]};
    const rappiList = data.rappi || [];
    const uberList = data.uber || [];

    modalTitle.innerHTML = `<b>${esc(brandName)}</b> · Delivery`;

    let html = '';
    html += `<div class="cat"><div class="cat__head"><i class="fab fa-uber"></i>Uber Eats</div>`;
    if (!uberList.length) html += `<div class="no-data">No disponible</div>`;
    else uberList.forEach(x => {
      html += `<a class="link" href="${x.url}" target="_blank" rel="noopener">
        <span class="link__b"><i class="fas fa-location-dot"></i>${esc(x.branch)}</span>
        <span class="link__go">Pedir →</span>
      </a>`;
    });
    html += `</div>`;

    html += `<div class="cat"><div class="cat__head"><i class="fas fa-motorcycle"></i>Rappi</div>`;
    if (!rappiList.length) html += `<div class="no-data">No disponible</div>`;
    else rappiList.forEach(x => {
      html += `<a class="link" href="${x.url}" target="_blank" rel="noopener">
        <span class="link__b"><i class="fas fa-location-dot"></i>${esc(x.branch)}</span>
        <span class="link__go">Pedir →</span>
      </a>`;
    });
    html += `</div>`;

    html += `<div class="cat"><div class="cat__head"><i class="fas fa-car"></i>DiDi Food</div>
      <div class="no-data">Sin enlaces disponibles</div></div>`;

    modalBody.innerHTML = html;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModalFunc(){
    modal.classList.remove('active');
    document.body.style.overflow = '';
  }
  closeModal.addEventListener('click', closeModalFunc);
  modal.addEventListener('click', e => { if (e.target === modal) closeModalFunc(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('active')) closeModalFunc();
  });

  /* ══════════════════════════════════════════════════════
     ADMIN (oculto)
     ══════════════════════════════════════════════════════ */
  const adminPanel = document.getElementById('admin-panel');
  const adminTrigger = document.getElementById('admin-trigger');

  adminTrigger.addEventListener('click', e => {
    e.stopPropagation();
    adminPanel.classList.toggle('visible');
    if (adminPanel.classList.contains('visible')){
      adminPanel.scrollIntoView({behavior:'smooth', block:'center'});
    }
  });

  document.getElementById('add-link-btn').addEventListener('click', () => {
    const name = document.getElementById('link-title').value.trim();
    const url = document.getElementById('link-url').value.trim();
    if (!name || !url){ alert('Completa título y URL'); return; }
    try { new URL(url); } catch { alert('URL no válida'); return; }
    brands.push({name, category:'', menuUrl:url, instaUrl:url, thumb:'', handle:''});
    INDEX = buildIndex();
    render();
    document.getElementById('link-title').value = '';
    document.getElementById('link-url').value = '';
  });

  document.getElementById('reset-links-btn').addEventListener('click', () => {
    if (confirm('¿Restaurar marcas originales?')){
      brands = JSON.parse(JSON.stringify(DEFAULT));
      INDEX = buildIndex();
      render();
    }
  });

  /* INIT */
  render();
})();
</script>
</body>
</html>
